# Agilify IT Bot: test on every pull request, deploy to App Service on merge to main.
# Deploys with sp-agilify-bot-deploy via GitHub OIDC (no secret). That identity has
# Website Contributor on rg-agilify-itdesk only: it can deploy code, nothing else.
name: bot

on:
  pull_request:
    paths: ["bot/**", "pytest.ini", ".github/workflows/deploy-bot.yml"]
  push:
    branches: [main]
    paths: ["bot/**", "pytest.ini", ".github/workflows/deploy-bot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements*.txt
      - run: pip install -r bot/requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Package (bot code + requirements, no tests)
        run: |
          mkdir -p dist
          rsync -a --exclude tests --exclude teams-app --exclude '__pycache__' bot/ dist/bot/
          cp bot/requirements.txt dist/requirements.txt
          cd dist && zip -qr ../bot.zip . && cd ..
          unzip -l bot.zip

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-agilify-itbot
          package: bot.zip
